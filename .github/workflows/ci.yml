name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        id: install
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Unit tests
        run: |
          if [ "${{ steps.install.outcome }}" = "success" ]; then
            python -m unittest discover -s tests -p "test_*.py"
          else
            echo "x64dbg_automate failed to install on Linux; runtime.py imports it at module load."
            echo "Running CLI unit tests only (PYTHONPATH=src)."
            PYTHONPATH=src python -m unittest tests.test_cli
          fi
